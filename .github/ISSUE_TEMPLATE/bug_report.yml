name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest input or code that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "Node version, Chrome version (local runs), the URL or a Lighthouse JSON report if you can share it"
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
